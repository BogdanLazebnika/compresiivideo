<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Compressor</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #log { white-space: pre-wrap; background: #f0f0f0; padding: 10px; margin-top: 10px; max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>

<h2>Local Video Compressor</h2>

<input type="file" id="upload" accept="video/*">
<button id="compressBtn">Стиснути</button>

<p id="status"></p>
<a id="download" style="display:none;">Завантажити</a>

<pre id="log"></pre>

<!-- Стабільна версія для iPhone -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<script>
const { createFFmpeg, fetchFile } = FFmpeg;

// Локальний corePath можна залишити на CDN 0.11.0 для стабільності
const ffmpeg = createFFmpeg({
  log: true,
  corePath: "https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js",
  logger: ({ type, message }) => {
    // Виводимо всі логи ffmpeg у блок #log
    const logEl = document.getElementById("log");
    logEl.innerText += `[${type}] ${message}\n`;
    logEl.scrollTop = logEl.scrollHeight; // автоскрол
  }
});

const upload = document.getElementById("upload");
const status = document.getElementById("status");
const download = document.getElementById("download");
const logEl = document.getElementById("log");
const button = document.getElementById("compressBtn");

button.addEventListener("click", async () => {

  logEl.innerText = ""; // очищаємо лог перед стартом

  if (!upload.files.length) {
    alert("Оберіть відео");
    return;
  }

  try {

    status.innerText = "Завантаження движка...";

    if (!ffmpeg.isLoaded()) {
      await ffmpeg.load();
    }

    status.innerText = "Підготовка відео...";

    const file = upload.files[0];

    // Автоматично визначаємо розширення
    const ext = file.name.split('.').pop();
    const fileName = "input." + ext;

    ffmpeg.FS("writeFile", fileName, await fetchFile(file));

    status.innerText = "Стиснення...";

    await ffmpeg.run(
      "-i", fileName,
      "-vcodec", "libx264",
      "-crf", "28",
      "-preset", "veryfast",
      "output.mp4"
    );

    status.innerText = "Формування файлу...";

    const data = ffmpeg.FS("readFile", "output.mp4");

    const url = URL.createObjectURL(
      new Blob([data.buffer], { type: "video/mp4" })
    );

    download.href = url;
    download.download = "compressed.mp4";
    download.style.display = "block";
    download.innerText = "Завантажити відео";

    status.innerText = "Готово ✅";

  } catch (error) {
    // Виводимо будь-які помилки у #log
    logEl.innerText += `\n[error] ${error.message || error}`;
    status.innerText = "Помилка 😢 Перевір лог нижче";
  }

});
</script>

</body>
</html>
