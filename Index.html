<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Compressor</title>
</head>
<body>

<h2>Local Video Compressor</h2>

<input type="file" id="upload" accept="video/*">
<button id="compressBtn">Стиснути</button>

<p id="status"></p>
<a id="download" style="display:none;">Завантажити</a>

<!-- Стабільна версія для iPhone -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<script>
const { createFFmpeg, fetchFile } = FFmpeg;

const ffmpeg = createFFmpeg({
  log: true,
  corePath: "https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js"
});

const upload = document.getElementById("upload");
const status = document.getElementById("status");
const download = document.getElementById("download");
const button = document.getElementById("compressBtn");

button.addEventListener("click", async () => {

  if (!upload.files.length) {
    alert("Оберіть відео");
    return;
  }

  try {

    status.innerText = "Завантаження движка...";

    if (!ffmpeg.isLoaded()) {
      await ffmpeg.load();
    }

    status.innerText = "Підготовка відео...";

    const file = upload.files[0];

    ffmpeg.FS("writeFile", "input.mp4", await fetchFile(file));

    status.innerText = "Стиснення...";

    await ffmpeg.run(
      "-i", "input.mp4",
      "-vcodec", "libx264",
      "-crf", "28",
      "-preset", "veryfast",
      "output.mp4"
    );

    status.innerText = "Формування файлу...";

    const data = ffmpeg.FS("readFile", "output.mp4");

    const url = URL.createObjectURL(
      new Blob([data.buffer], { type: "video/mp4" })
    );

    download.href = url;
    download.download = "compressed.mp4";
    download.style.display = "block";
    download.innerText = "Завантажити відео";

    status.innerText = "Готово ✅";

  } catch (error) {
    console.error(error);
    status.innerText = "Помилка 😢 Спробуй менше відео";
  }

});
</script>

</body>
</html>
